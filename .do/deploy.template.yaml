spec:
  name: chobble-tickets
  services:
    - name: web
      # Prebuilt OCI image assembled by devenv (devenv.nix,
      # outputs.tickets-image) and published by
      # .github/workflows/publish-image.yml on every merge to main.
      image:
        registry_type: GHCR
        registry: chobbledotcom
        repository: tickets
        tag: latest
      http_port: 3000
      instance_count: 1
      instance_size_slug: basic-xxs
      routes:
        - path: /
      envs:
        - key: DB_URL
          scope: RUN_TIME
          type: SECRET
        - key: DB_TOKEN
          scope: RUN_TIME
          type: SECRET
        - key: DB_ENCRYPTION_KEY
          scope: RUN_TIME
          type: SECRET
