name: Set up devenv
description: >-
  Install Nix and the devenv CLI, use the public devenv binary cache,
  restore the Nix store and the Deno dependency cache, evaluate the
  project environment once, and optionally populate it with deno
  install. The evaluated environment is the same one developers get
  from devenv shell.
inputs:
  install_dependencies:
    description: Populate the Deno module cache with deno install.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # Every step here pins shell: bash — jobs commonly set
    # `defaults.run.shell: devenv shell bash -- -e {0}`, which must not be
    # used before the devenv CLI exists.
    - name: Set up Nix
      uses: cachix/install-nix-action@v31

    # Pull devenv's own prebuilt binaries from its public cache. We run
    # no private cache service of our own; the other substituters are
    # cache.nixos.org and the cached Nix store below.
    - name: Use the devenv binary cache
      uses: cachix/cachix-action@v16
      with:
        name: devenv

    # Part of the store-cache key: the cache holds the store database
    # as well as the files, so the Nix version that wrote it must match
    # the one that reads it back.
    - name: Resolve the Nix version
      shell: bash
      id: nix-version
      run: echo "version=$(nix --version | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

    # The runner's single biggest setup cost is downloading the shell
    # closure (dominated by Chromium's dependency tree). The Nix store
    # rides the GitHub Actions cache — restored as real store paths
    # with a merged database, saved once per dependency change — so the
    # downloads happen only when the environment definition moves.
    - name: Restore the Nix store
      id: nix-store
      uses: nix-community/cache-nix-action/restore@v7
      with:
        primary-key: nix-${{ steps.nix-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'devenv.yaml', 'devenv.nix') }}
        restore-prefixes-first-match: nix-${{ steps.nix-version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Install devenv.sh
      shell: bash
      run: nix profile add nixpkgs#devenv

    # Evaluating the shell here runs the enterShell Deno-version guard, so a
    # broken pin fails the job before anything else, and yields the version
    # for the dependency-cache key.
    - name: Resolve the Deno version
      shell: bash
      id: deno-version
      run: |
        set -euo pipefail
        version="$(devenv shell -- deno --version | sed -n 's/^deno \([^ ]*\).*/\1/p')"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # One repo-wide dependency cache instead of one per workflow/job.
    - name: Cache Deno dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/deno
        key: deno-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-${{ hashFiles('deno.lock', 'deno.json', 'e2e-payments/deno.json') }}
        restore-keys: |
          deno-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}-

    - name: Install Deno dependencies
      if: inputs.install_dependencies == 'true'
      shell: bash
      run: devenv shell -- deno install --allow-scripts

    - name: Save the Nix store
      if: steps.nix-store.outputs.hit-primary-key != 'true'
      uses: nix-community/cache-nix-action/save@v7
      with:
        primary-key: ${{ steps.nix-store.outputs.primary-key }}
