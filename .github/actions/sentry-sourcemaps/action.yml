name: Sentry source maps
description: >-
  Inject debug IDs into the built edge bundle (before deploy) or upload the
  bundle + source map to Sentry for a release (after deploy). No-op unless an
  auth token is provided, so deploys keep working without Sentry configured.
inputs:
  command:
    description: '"inject" (run before deploy) or "upload" (run after deploy).'
    required: true
  auth_token:
    description: Sentry auth token. When empty the step is skipped entirely.
    required: false
    default: ""
  sentry_url:
    description: Base URL of the Sentry/Bugsink instance (e.g. https://bugs.chobble.com/).
    required: false
    default: ""
  org:
    description: Sentry organization slug.
    required: false
    default: ""
  project:
    description: Sentry project slug.
    required: false
    default: ""
  release:
    description: Release identifier (must match the SDK's release, e.g. chobble-tickets@<sha>).
    required: true
  file:
    description: Built bundle to process; its `.map` sibling is processed too.
    required: false
    default: bunny-script.ts
runs:
  using: composite
  steps:
    # The CLI runs with SENTRY_AUTH_TOKEN in its environment, so it is
    # downloaded at a pinned version and verified against a recorded sha256
    # before it runs. The standalone binary is the same one the npm wrapper
    # spawns, without npm's unpinned dependency resolution.
    - name: Install sentry-cli
      if: ${{ inputs.auth_token != '' }}
      shell: bash
      env:
        SENTRY_CLI_VERSION: "3.7.0"
        # sha256 of sentry-cli-Linux-x86_64 for the version above.
        SENTRY_CLI_SHA256: cec71d46a7cc394c94b6e75f1601985c710d457376c546ef3975567b3671563b
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL -o "$RUNNER_TEMP/bin/sentry-cli" \
          "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
        echo "${SENTRY_CLI_SHA256}  $RUNNER_TEMP/bin/sentry-cli" \
          | sha256sum --check --strict -
        chmod +x "$RUNNER_TEMP/bin/sentry-cli"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    # Inject debug IDs into the bundle and its map *before* deploy, so the code
    # that actually runs in Bunny carries the IDs Sentry matches maps by. This
    # is filename-independent, which matters because we can't predict the path
    # the edge runtime reports in stack frames.
    #
    # The CLI injects only files it reads as JavaScript, and merely prints
    # "Nothing to inject" for a `.ts` bundle, so the work happens on a `.js`
    # copy. `prepare` writes that copy and `adopt` puts the injected code back
    # on the deployed bundle. The copy stays on disk for the upload step, which
    # must send the same pair the debug IDs were written into.
    - name: Inject debug IDs
      if: ${{ inputs.command == 'inject' && inputs.auth_token != '' }}
      shell: bash
      run: |
        js="$(deno run --allow-read --allow-write \
          scripts/sentry-debug-ids.ts prepare "${{ inputs.file }}")"
        sentry-cli sourcemaps inject "$js" "$js.map"
        grep -q "_sentryDebugIds" "$js" || {
          echo "::error::sentry-cli injected no debug ID into $js"
          exit 1
        }
        deno run --allow-read --allow-write \
          scripts/sentry-debug-ids.ts adopt "${{ inputs.file }}"
        grep -q "_sentryDebugIds" "${{ inputs.file }}" || {
          echo "::error::the deployed bundle carries no debug ID"
          exit 1
        }

    # Upload the injected `.js` pair *after* deploy. It carries the same debug
    # IDs as the deployed bundle, which is what Sentry matches a map by.
    - name: Upload source maps
      if: ${{ inputs.command == 'upload' && inputs.auth_token != '' }}
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.auth_token }}
        SENTRY_URL: ${{ inputs.sentry_url }}
        SENTRY_ORG: ${{ inputs.org }}
        SENTRY_PROJECT: ${{ inputs.project }}
      run: |
        js="$(deno run --allow-read scripts/sentry-debug-ids.ts \
          js-path "${{ inputs.file }}")"
        sentry-cli sourcemaps upload \
          --release "${{ inputs.release }}" \
          "$js" "$js.map"
