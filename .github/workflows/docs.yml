name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: devenv --profile ci shell bash -- -e {0}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubicloud-standard-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: $/.github/actions/setup-devenv
        with:
          install_dependencies: "true"
          profile: ci

      - name: Generate docs
        run: >-
          deno doc --html --name="Chobble Tickets" --output=docs-output
          src/doc.ts
          src/docs/database.ts
          src/docs/crypto.ts
          src/docs/payments.ts
          src/docs/email.ts
          src/docs/tickets.ts
          src/docs/listings.ts
          src/docs/config.ts
          src/docs/utilities.ts
          src/docs/embed.ts
          src/docs/webhooks.ts
          src/docs/demo.ts

      - name: Check model walkthroughs
        run: deno task check:model-guides

      - name: Generate model walkthroughs
        run: deno task model-guides:site

      - name: Disable Jekyll processing
        run: touch docs-output/.nojekyll

      - name: Add Pages home page
        run: |
          cat > docs-output/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Chobble Tickets Documentation</title>
            <style>
              body { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; font: 16px/1.6 system-ui, sans-serif; color-scheme: light dark; }
              li { margin: 0.5rem 0; }
            </style>
          </head>
          <body>
            <h1>Chobble Tickets Documentation</h1>
            <ul>
              <li><a href="doc.ts/index.html">API reference</a> — every source module.</li>
              <li><a href="models/index.html">Model walkthroughs</a> — each TLA model in everyday words.</li>
            </ul>
          </body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: docs-output

  deploy:
    needs: build
    runs-on: ubicloud-standard-4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
