name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: devenv --profile ci shell bash -- -e {0}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubicloud-standard-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
        with:
          install_dependencies: "false"
          profile: ci

      - name: Generate docs
        run: >-
          deno doc --html --name="Chobble Tickets" --output=docs-output
          src/doc.ts
          src/docs/database.ts
          src/docs/crypto.ts
          src/docs/payments.ts
          src/docs/email.ts
          src/docs/tickets.ts
          src/docs/listings.ts
          src/docs/config.ts
          src/docs/utilities.ts
          src/docs/embed.ts
          src/docs/webhooks.ts
          src/docs/demo.ts

      - name: Disable Jekyll processing
        run: touch docs-output/.nojekyll

      - name: Add root redirect to overview page
        run: |
          cat > docs-output/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=doc.ts/index.html">
            <title>Chobble Tickets Documentation</title>
          </head>
          <body>
            <p>Redirecting to <a href="doc.ts/index.html">documentation</a>...</p>
          </body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-output

  deploy:
    needs: build
    runs-on: ubicloud-standard-4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
