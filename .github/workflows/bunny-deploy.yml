name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      script_id:
        description: "Override Bunny staging script ID (defaults to BUNNY_STAGING_SCRIPT_ID secret)"
        required: false
        type: string
      run_backup:
        description: "Back up the database before deploying (uncheck only if the backup is broken)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubicloud-standard-4
    # The secrets this job reads live in this environment, which only main can use.
    environment: staging
    # Step conditions cannot read the secrets context, so the key's presence
    # is derived here once. The key itself stays in secrets and step inputs.
    env:
      HAS_MAIN_INSTANCE_KEY: ${{ secrets.MAIN_INSTANCE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # A missing secret must stop the run here, not after the build or part
      # of the way through a deploy.
      - name: Check the secrets this run needs
        shell: bash
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          BUNNY_STAGING_SCRIPT_ID: ${{ inputs.script_id || secrets.BUNNY_STAGING_SCRIPT_ID }}
          SCRIPT_ID_OVERRIDE: ${{ inputs.script_id }}
          RUN_BACKUP: ${{ github.event_name == 'workflow_dispatch' && inputs.run_backup && 'yes' || '' }}
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
          SCRIPT_ID: ${{ inputs.script_id || secrets.BUNNY_STAGING_SCRIPT_ID }}
          SITE_URL: ${{ secrets.MAIN_INSTANCE_KEY == '' && vars.STAGING_SITE_URL || '' }}
          BACKUP_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.run_backup && 'backup-zone' || '' }}
          MAIN_INSTANCE: ${{ secrets.MAIN_INSTANCE }}
          MAIN_INSTANCE_KEY: ${{ secrets.MAIN_INSTANCE_KEY }}
          STORAGE_ZONE_NAME: ${{ secrets.STORAGE_ZONE_NAME }}
          STORAGE_ZONE_KEY: ${{ secrets.STORAGE_ZONE_KEY }}
          CDN_URL: ${{ secrets.CDN_URL }}
          CDN_BUNNY_STORAGE_ZONE_NAME: ${{ secrets.CDN_BUNNY_STORAGE_ZONE_NAME }}
          CDN_BUNNY_STORAGE_ZONE_KEY: ${{ secrets.CDN_BUNNY_STORAGE_ZONE_KEY }}
          CDN_BUNNY_STORAGE_HOST: ${{ secrets.CDN_BUNNY_STORAGE_HOST }}
          CDN_BUNNY_PULL_ZONE_ID: ${{ secrets.CDN_BUNNY_PULL_ZONE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_CLI_URL: ${{ secrets.SENTRY_CLI_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          scripts/ci/require-env.sh BUNNY_ACCESS_KEY BUNNY_STAGING_SCRIPT_ID \
            --if RUN_BACKUP MAIN_INSTANCE,MAIN_INSTANCE_KEY,STORAGE_ZONE_NAME,STORAGE_ZONE_KEY \
            --if MAIN_INSTANCE_KEY MAIN_INSTANCE \
            --if SCRIPT_ID_OVERRIDE MAIN_INSTANCE_KEY \
            --unless MAIN_INSTANCE_KEY STAGING_SITE_URL \
            --together CDN_URL,CDN_BUNNY_STORAGE_ZONE_NAME,CDN_BUNNY_STORAGE_ZONE_KEY,CDN_BUNNY_STORAGE_HOST,CDN_BUNNY_PULL_ZONE_ID \
            --if SENTRY_AUTH_TOKEN SENTRY_CLI_URL,SENTRY_ORG,SENTRY_PROJECT
          # shellcheck disable=SC2086 -- an empty value must add no check.
          scripts/ci/check-credentials.sh bunny main-instance cdn-zone site $BACKUP_CHECK

      - name: Build Bunny edge script
        id: build
        uses: $/.github/actions/build-bunny-script
        with:
          build_commit: ${{ github.sha }}
          cdn_url: ${{ secrets.CDN_URL }}
          cdn_bunny_storage_zone_name: ${{ secrets.CDN_BUNNY_STORAGE_ZONE_NAME }}
          cdn_bunny_storage_zone_key: ${{ secrets.CDN_BUNNY_STORAGE_ZONE_KEY }}
          cdn_bunny_storage_host: ${{ secrets.CDN_BUNNY_STORAGE_HOST }}
          cdn_bunny_pull_zone_id: ${{ secrets.CDN_BUNNY_PULL_ZONE_ID }}
          bunny_access_key: ${{ secrets.BUNNY_ACCESS_KEY }}

      # Back up the staging site's database before deploying (it migrates on its
      # next request). Only manual runs back up: a push to main (a merge) skips
      # the backup. A manual run can uncheck run_backup to skip the backup too
      # (e.g. if backups are broken).
      - name: Back up the staging site
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_backup }}
        uses: $/.github/actions/backup-site
        with:
          main_instance: ${{ secrets.MAIN_INSTANCE }}
          main_instance_key: ${{ secrets.MAIN_INSTANCE_KEY }}
          script_id: ${{ inputs.script_id || secrets.BUNNY_STAGING_SCRIPT_ID }}
          storage_zone_name: ${{ secrets.STORAGE_ZONE_NAME }}
          storage_zone_key: ${{ secrets.STORAGE_ZONE_KEY }}

      # Inject Sentry debug IDs into the bundle before deploy (no-op without a
      # SENTRY_AUTH_TOKEN secret). Must run before the deploy below.
      - name: Inject Sentry debug IDs
        uses: $/.github/actions/sentry-sourcemaps
        with:
          command: inject
          auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          release: chobble-tickets@${{ github.sha }}

      # Resolve the staging site's own public origin for the selected script
      # when the MAIN_INSTANCE_KEY secret is set. Without it, the run takes
      # the staging origin from the STAGING_SITE_URL variable instead. Either
      # way the update-mode wait polls the deployed site, never the main
      # instance that serves the fleet's credentials.
      - name: Resolve the staging site's URL
        id: resolve-site
        if: ${{ env.HAS_MAIN_INSTANCE_KEY == 'true' }}
        uses: $/.github/actions/resolve-site-credentials
        with:
          main_instance: ${{ secrets.MAIN_INSTANCE }}
          main_instance_key: ${{ secrets.MAIN_INSTANCE_KEY }}
          script_id: ${{ inputs.script_id || secrets.BUNNY_STAGING_SCRIPT_ID }}

      # A keyless run takes the staging origin from STAGING_SITE_URL. It fails
      # before the update flag is set when the variable is not a usable https
      # origin (blank or whitespace included), or when a script id override
      # would poll the staging origin for a different site: a deploy that
      # cannot name its site would otherwise set UPDATE_IN_PROGRESS and then
      # wedge the wait.
      - name: Take the staging URL from the variable when no key was supplied
        id: staging-url
        if: ${{ env.HAS_MAIN_INSTANCE_KEY != 'true' }}
        env:
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
          SCRIPT_ID_OVERRIDE: ${{ inputs.script_id }}
        run: |
          if [ -n "$SCRIPT_ID_OVERRIDE" ]; then
            echo "A script id override needs the MAIN_INSTANCE_KEY secret, so its" >&2
            echo "own site URL can be resolved." >&2
            exit 1
          fi
          url=$(printf '%s' "$STAGING_SITE_URL" | tr -d '[:space:]')
          url=${url%/}
          # An origin only: https, a host name of dot-separated labels (each
          # label starts and ends with a letter or digit, so empty and
          # hyphen-edged labels fail), an optional port in 1-65535. No
          # credentials, path, query or fragment can reach update-mode begin,
          # which sets the update flag before it polls this URL.
          port=${url##*:}
          case $port in
            [0-9]*) ;;
            *) port=443 ;;
          esac
          host=${url#https://}
          host=${host%:*}
          if ! printf '%s' "$url" |
            grep -Eqx 'https://[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*(:[0-9]{1,5})?' ||
            ((10#$port < 1 || 10#$port > 65535)) ||
            [ "${#host}" -gt 253 ] ||
            printf '%s' "$host" | tr '.' '\n' | grep -Eq '.{64,}'; then
            echo "STAGING_SITE_URL is not an https origin (https://host[:port]): '$STAGING_SITE_URL'." >&2
            echo "Host labels must be 1-63 characters and the host at most 253." >&2
            echo "Set it to the staging site's public origin, or set the" >&2
            echo "MAIN_INSTANCE_KEY secret." >&2
            exit 1
          fi
          echo "site_url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging
        uses: $/.github/actions/deploy-bunny-script
        with:
          script_id: ${{ inputs.script_id || secrets.BUNNY_STAGING_SCRIPT_ID }}
          api_key: ${{ secrets.BUNNY_ACCESS_KEY }}
          site_url: ${{ steps.resolve-site.outputs.site_url || steps.staging-url.outputs.site_url }}
          build_tag: ${{ steps.build.outputs.build_tag }}

      # Upload source maps for this release after deploy (no-op without secrets).
      - name: Upload Sentry source maps
        uses: $/.github/actions/sentry-sourcemaps
        with:
          command: upload
          auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry_url: ${{ secrets.SENTRY_CLI_URL }}
          org: ${{ secrets.SENTRY_ORG }}
          project: ${{ secrets.SENTRY_PROJECT }}
          release: chobble-tickets@${{ github.sha }}
