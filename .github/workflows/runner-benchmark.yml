name: Runner benchmark

# Scratch branch only. Time the heavy models on two runner sizes, with and
# without the pass-cache step that the pull request workflow has.
on:
  push:
    branches: [claude/runner-benchmark]

permissions:
  contents: read

jobs:
  benchmark:
    name: bench ${{ matrix.model }} ${{ matrix.runner }} ${{ matrix.variant }} ${{ matrix.rep }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        model:
          - ModalLifecycle
          - SubscriptionCancellation
          - SubscriptionCheckout
          - SubscriptionLifecycle
          - SubscriptionRecords
          - SubscriptionRenewals
        runner:
          - ubicloud-standard-2
          - ubicloud-standard-4
        variant: [plain, cache]
        rep: [a, b]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up model tools
        uses: $/.github/actions/setup-model-tools

      - name: Restore the model passes
        if: matrix.variant == 'cache'
        uses: actions/cache@v4.3.0
        with:
          path: .verify-models-passes
          key: verify-models-${{ runner.os }}-${{ matrix.model }}-${{ github.sha }}-${{ matrix.runner }}-${{ matrix.rep }}
          restore-keys: |
            verify-models-${{ runner.os }}-${{ matrix.model }}-

      - name: Check the machine safety model
        env:
          MODEL: ${{ matrix.model }}
        run: deno task verify:models --model "$MODEL"
