name: Test

# A merge queue builds its branch by pushing it, so `push` and `merge_group`
# both fire on one queue branch and the suite runs twice on the same commit.
# `merge_group` reports both check names on the queue ref. The `push` run there
# only adds cost, and one more chance for a stalled runner to time the queue
# out.
#
# The queue does NOT gate on these two checks. GitHub waits for the checks a
# ruleset marks REQUIRED. `checks` and `test` are not in that list for `main`,
# so a red run here never blocks a merge. Runs 33021228000, 33022892823 and
# 33024444803 each failed `checks` in the queue and merged anyway. See TODO.md,
# "The merge queue does not gate on `checks` or `test`".
on:
  push:
    branches-ignore: [main, "gh-readonly-queue/**"]
  merge_group:

env:
  STRIPE_MOCK_VERSION: "0.188.0"

# Both jobs only read the checkout. Caching and artifact upload use the Actions
# runtime token, not this one.
permissions:
  contents: read

# Two jobs that run side by side. Together their steps mirror `getSteps()` in
# scripts/precommit/steps.ts — if you add a step there, add it to whichever job
# it belongs to here. Nothing in the suite reads what the static checks
# produce, so running them beside the suite instead of ahead of it takes their
# time off the critical path.
jobs:
  checks:
    runs-on: ubicloud-standard-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      # Each check is its own step so a failure is attributed individually in
      # the Actions UI.
      - name: Lint
        run: deno task lint:ci

      - name: Typecheck
        run: deno task typecheck

      - name: Check for code duplication (CPD)
        run: deno task cpd

      - name: Check for renamed duplicate functions
        run: deno task check:shapes

      - name: Check user-facing copy
        run: deno task check:copy

      - name: Check comment size
        run: deno task check:comments

      - name: Check module import names
        run: deno task check:imports

      - name: Check payment e2e labels against the catalog
        run: deno task check:e2e-labels

      - name: Check known-equivalent mutant records
        run: deno task check:equivalents

      - name: Build edge bundle
        run: deno task build:edge

  test:
    runs-on: ubicloud-standard-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: ./.github/actions/setup-deno

      # stripe-mock is downloaded, started, and stopped by scripts/run-tests.ts
      # (invoked via the test:coverage step). Caching .bin just avoids
      # re-downloading it on every run.
      - name: Cache stripe-mock
        uses: actions/cache@v4
        with:
          path: .bin
          key: stripe-mock-${{ env.STRIPE_MOCK_VERSION }}-linux-amd64

      - name: Test with coverage
        env:
          DB_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: deno task test:coverage

      - name: Generate HTML coverage report
        if: always()
        run: deno coverage coverage --html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/
