name: Branch preview

# Each open pull request from this repository gets its own Tickets site on
# the staging Bunny account. A push updates the site and keeps its database.
# Closing the pull request, merged or not, deletes the site, its database, and
# its Stripe webhooks. A new site is set up with the shared owner login and the
# sandbox payment keys. A pull request from a fork gets no preview, because a
# fork run has no secrets.
#
# The secrets live in the `preview` environment: BUNNY_STAGING_ACCOUNT_KEY,
# STAGING_STORAGE_ZONE_NAME, STAGING_STORAGE_ZONE_KEY, HOST_EMAIL_PROVIDER,
# HOST_EMAIL_API_KEY, HOST_EMAIL_FROM_ADDRESS, PREVIEW_OWNER_USERNAME,
# PREVIEW_OWNER_PASSWORD, the sandbox keys STRIPE_SECRET_KEY,
# SQUARE_ACCESS_TOKEN, SQUARE_LOCATION_ID, SUMUP_API_KEY and
# SUMUP_MERCHANT_CODE, and the optional static CDN set CDN_STAGING_URL,
# CDN_BUNNY_STAGING_STORAGE_ZONE_NAME, CDN_BUNNY_STAGING_STORAGE_ZONE_KEY,
# CDN_BUNNY_STAGING_STORAGE_HOST and CDN_BUNNY_STAGING_PULL_ZONE_ID. See
# docs/preview-deploys.md.
#
# A preview sends real host mail. It never receives MAIN_INSTANCE_KEY or the
# production Bunny key.
#
# A person can also start the workflow by hand with a branch name. The reset
# job then deletes the preview of that branch, the same way a closed pull
# request does. A preview that stays broken can be made new this way. The next
# run of the pull request for the branch makes the new preview.
#
# The deploy job publishes the branch guide videos to the staging CDN before
# the build. The build bakes their URLs into the create-listing page.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose preview to delete. Its next pull request run makes a new one.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# One run at a time for each branch. A run is never cancelled, because a stop
# in the middle of a create can leave a database with no script.
concurrency:
  group: preview-${{ github.event.pull_request.head.ref || inputs.branch }}
  cancel-in-progress: false

jobs:
  # A queued push run can start after its pull request closed. This job asks
  # GitHub for the pull request state now, so that run does not make a new
  # preview. A fork run stops here.
  check:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.state.outputs.open }}
    steps:
      - name: Read the pull request state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST" --jq .state)
          if [ "$state" = "open" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: ${{ github.event.action != 'closed' && needs.check.outputs.open == 'true' }}
    runs-on: ubicloud-standard-4
    # The secrets this job reads live in this environment. The url puts a
    # "View deployment" link for the preview on the pull request.
    environment:
      name: preview
      url: ${{ steps.preview.outputs.site_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # A missing secret must stop the run here, not after the build or part
      # of the way through a create.
      - name: Check the secrets this run needs
        shell: bash
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          STAGING_STORAGE_ZONE_NAME: ${{ secrets.STAGING_STORAGE_ZONE_NAME }}
          STAGING_STORAGE_ZONE_KEY: ${{ secrets.STAGING_STORAGE_ZONE_KEY }}
          HOST_EMAIL_PROVIDER: ${{ secrets.HOST_EMAIL_PROVIDER }}
          HOST_EMAIL_API_KEY: ${{ secrets.HOST_EMAIL_API_KEY }}
          HOST_EMAIL_FROM_ADDRESS: ${{ secrets.HOST_EMAIL_FROM_ADDRESS }}
          CDN_URL: ${{ secrets.CDN_STAGING_URL }}
          CDN_BUNNY_STORAGE_ZONE_NAME: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_ZONE_NAME }}
          CDN_BUNNY_STORAGE_ZONE_KEY: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_ZONE_KEY }}
          CDN_BUNNY_STORAGE_HOST: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_HOST }}
          CDN_BUNNY_PULL_ZONE_ID: ${{ secrets.CDN_BUNNY_STAGING_PULL_ZONE_ID }}
          PREVIEW_OWNER_USERNAME: ${{ secrets.PREVIEW_OWNER_USERNAME }}
          PREVIEW_OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
        run: |
          scripts/ci/require-env.sh BUNNY_ACCESS_KEY \
            STAGING_STORAGE_ZONE_NAME STAGING_STORAGE_ZONE_KEY \
            HOST_EMAIL_PROVIDER HOST_EMAIL_API_KEY HOST_EMAIL_FROM_ADDRESS \
            PREVIEW_OWNER_USERNAME PREVIEW_OWNER_PASSWORD STRIPE_SECRET_KEY \
            SQUARE_ACCESS_TOKEN SQUARE_LOCATION_ID \
            SUMUP_API_KEY SUMUP_MERCHANT_CODE \
            --together CDN_URL,CDN_BUNNY_STORAGE_ZONE_NAME,CDN_BUNNY_STORAGE_ZONE_KEY,CDN_BUNNY_STORAGE_HOST,CDN_BUNNY_PULL_ZONE_ID
          scripts/ci/check-credentials.sh bunny cdn-zone

      - name: Publish guide videos
        id: guides
        uses: $/.github/actions/publish-guide-videos
        with:
          bunny_access_key: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          cdn_url: ${{ secrets.CDN_STAGING_URL }}
          cdn_bunny_storage_zone_name: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_ZONE_NAME }}
          cdn_bunny_storage_zone_key: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_ZONE_KEY }}
          cdn_bunny_storage_host: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_HOST }}
          cdn_bunny_pull_zone_id: ${{ secrets.CDN_BUNNY_STAGING_PULL_ZONE_ID }}

      - name: Build Bunny edge script
        id: build
        uses: $/.github/actions/build-bunny-script
        with:
          build_commit: ${{ github.sha }}
          cdn_url: ${{ secrets.CDN_STAGING_URL }}
          cdn_bunny_storage_zone_name: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_ZONE_NAME }}
          cdn_bunny_storage_zone_key: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_ZONE_KEY }}
          cdn_bunny_storage_host: ${{ secrets.CDN_BUNNY_STAGING_STORAGE_HOST }}
          cdn_bunny_pull_zone_id: ${{ secrets.CDN_BUNNY_STAGING_PULL_ZONE_ID }}
          bunny_access_key: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          guide_videos: ${{ steps.guides.outputs.guide_videos }}

      # Finds the preview of this branch by name. A new branch gets a database,
      # a script and every secret, and the build is published. An old preview
      # keeps its database and its secrets, and the next step deploys the build.
      - name: Create or complete the preview
        id: preview
        shell: devenv --profile ci shell bash -- -e {0}
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          STAGING_STORAGE_ZONE_NAME: ${{ secrets.STAGING_STORAGE_ZONE_NAME }}
          STAGING_STORAGE_ZONE_KEY: ${{ secrets.STAGING_STORAGE_ZONE_KEY }}
          HOST_EMAIL_PROVIDER: ${{ secrets.HOST_EMAIL_PROVIDER }}
          HOST_EMAIL_API_KEY: ${{ secrets.HOST_EMAIL_API_KEY }}
          HOST_EMAIL_FROM_ADDRESS: ${{ secrets.HOST_EMAIL_FROM_ADDRESS }}
        run: |
          deno run \
            --allow-env=BUNNY_ACCESS_KEY,BUNNY_API_KEY,STAGING_STORAGE_ZONE_NAME,STAGING_STORAGE_ZONE_KEY,HOST_EMAIL_PROVIDER,HOST_EMAIL_API_KEY,HOST_EMAIL_FROM_ADDRESS \
            --allow-read=bunny-script.ts \
            --allow-net=api.bunny.net \
            scripts/preview.ts ensure "$BRANCH" bunny-script.ts >> "$GITHUB_OUTPUT"

      - name: Deploy the build to the existing preview
        if: ${{ steps.preview.outputs.published == 'false' }}
        uses: $/.github/actions/deploy-bunny-script
        with:
          script_id: ${{ steps.preview.outputs.script_id }}
          api_key: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          site_url: ${{ steps.preview.outputs.site_url }}
          build_tag: ${{ steps.build.outputs.build_tag }}

      # A new preview shows the "Not Activated" page until its setup is done.
      # This step completes /setup with the shared owner login and saves the
      # sandbox payment keys. A site that is already set up is left as it is.
      # The step may reach the preview only.
      - name: Set up the preview
        shell: devenv --profile ci shell bash -- -e {0}
        env:
          SITE_URL: ${{ steps.preview.outputs.site_url }}
          PREVIEW_OWNER_USERNAME: ${{ secrets.PREVIEW_OWNER_USERNAME }}
          PREVIEW_OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
        run: |
          site_hosts="$(deno run scripts/update-mode-hosts.ts "$SITE_URL")"
          deno run \
            --allow-env=PREVIEW_OWNER_USERNAME,PREVIEW_OWNER_PASSWORD,STRIPE_SECRET_KEY,SQUARE_ACCESS_TOKEN,SQUARE_LOCATION_ID,SUMUP_API_KEY,SUMUP_MERCHANT_CODE \
            --allow-net="$site_hosts" \
            scripts/preview.ts configure "$SITE_URL"

      - name: Show the preview address
        env:
          SITE_URL: ${{ steps.preview.outputs.site_url }}
        run: |
          echo "Preview: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: check
    if: ${{ github.event.action == 'closed' }}
    runs-on: ubicloud-standard-2
    # The secrets this job reads live in this environment.
    environment: preview

    steps:
      # The head commit exists after a merge or a close. It holds the scripts
      # that this run needs, even for the pull request that adds them.
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the secrets this run needs
        shell: bash
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          scripts/ci/require-env.sh BUNNY_ACCESS_KEY STRIPE_SECRET_KEY
          scripts/ci/check-credentials.sh bunny

      - name: Set up devenv
        uses: $/.github/actions/setup-devenv
        with:
          profile: ci

      - name: Delete the preview
        shell: devenv --profile ci shell bash -- -e {0}
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          deno run \
            --allow-env=BUNNY_ACCESS_KEY,BUNNY_API_KEY,STRIPE_SECRET_KEY \
            --allow-net=api.bunny.net,api.stripe.com \
            scripts/preview.ts remove "$BRANCH"

  # Deletes the preview of one branch that a person names. It reads the
  # scripts of the branch that the run starts from, so start it from main.
  reset:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubicloud-standard-2
    # The secrets this job reads live in this environment.
    environment: preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Check the secrets this run needs
        shell: bash
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          scripts/ci/require-env.sh BUNNY_ACCESS_KEY STRIPE_SECRET_KEY
          scripts/ci/check-credentials.sh bunny

      - name: Set up devenv
        uses: $/.github/actions/setup-devenv
        with:
          profile: ci

      - name: Delete the preview
        shell: devenv --profile ci shell bash -- -e {0}
        env:
          BRANCH: ${{ inputs.branch }}
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_STAGING_ACCOUNT_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          deno run \
            --allow-env=BUNNY_ACCESS_KEY,BUNNY_API_KEY,STRIPE_SECRET_KEY \
            --allow-net=api.bunny.net,api.stripe.com \
            scripts/preview.ts remove "$BRANCH"
