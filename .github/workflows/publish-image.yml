name: Publish Docker image

# Assembles the self-host OCI runtime image with devenv (devenv.nix,
# outputs.tickets-image) and pushes it to the GitHub Container Registry. The
# alternative-deployment platforms (fly.io, Render, DigitalOcean) and any
# self-hoster pull this image instead of building from source.
#
# The image contains the pinned Deno and the built static assets, so it is
# the same runtime the Bunny Edge bundle is built with. `latest` moves on
# every merge to main; redeploy or `docker pull` to update.
#
# No secrets are needed: GITHUB_TOKEN with `packages: write` scopes
# publishes to this repository's own ghcr.io package.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges to main close together must not race the :latest tag.
# Concurrency-group ordering is not guaranteed, so keep only one run at
# a time and make the pushes order-safe below: every run publishes an
# immutable per-commit tag, and moves :latest only after confirming its
# commit is still main's tip.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: devenv --profile ci shell bash -- -e {0}

jobs:
  publish:
    # workflow_dispatch can select any branch; only main may own :latest.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
        with:
          profile: ci

      # Builds the static assets and assembles the OCI image. See devenv.nix
      # (scripts.container-build) for why the Deno step runs in the shell
      # rather than in the sandbox.
      - name: Build the runtime image
        run: container-build

      - name: Load the image into the container engine
        run: container-load

      # Build the exact image that will be pushed, then boot it and prove
      # the server answers before it becomes anyone's :latest. The module cache
      # is baked in, so a healthy image answers within seconds. GitHub
      # runners ship Docker but not Podman, so every step picks the same
      # engine `container-load` falls back to.
      #
      # /health is served before any database work, so it alone cannot
      # prove the image serves a site. The probe after it asks for the
      # home page, which reads the settings table: on a fresh site that
      # must answer 503 (setup incomplete). A database or FFI failure
      # answers 500 or nothing, and fails publication.
      - name: Verify the image boots and serves
        env:
          # Throwaway key for the ephemeral container DB — not a real secret.
          DB_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          set -euo pipefail
          engine="$(command -v podman || command -v docker)"
          "$engine" rm -f tickets-verify >/dev/null 2>&1 || true
          "$engine" run -d --name tickets-verify -p 127.0.0.1:13000:3000 \
            -e DB_ENCRYPTION_KEY="$DB_ENCRYPTION_KEY" \
            ghcr.io/chobbledotcom/tickets:latest
          for _ in $(seq 1 20); do
            if [ "$(curl -fsS -m 5 http://127.0.0.1:13000/health 2>/dev/null)" = "Up :)" ]; then
              echo "Server answered /health."
              home="$(curl -sS -m 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:13000/)"
              if [ "$home" != "503" ]; then
                echo "::error::The home page answered $home where 503 was expected. Logs:"
                "$engine" logs tickets-verify || true
                "$engine" rm -f tickets-verify >/dev/null 2>&1 || true
                exit 1
              fi
              echo "Server answered the home page with 503 — the database path served."
              "$engine" rm -f tickets-verify >/dev/null
              exit 0
            fi
            sleep 3
          done
          echo "::error::The image did not serve /health within a minute. Logs:"
          "$engine" logs tickets-verify || true
          "$engine" rm -f tickets-verify >/dev/null 2>&1 || true
          exit 1

      - name: Copy the image to the registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GHCR creates the package private on the first push. Make it public
          # once, so platforms and self-hosters can pull without credentials:
          # GitHub → the chobbledotcom org → the tickets package → Package
          # settings → Change visibility.
          engine="$(command -v podman || command -v docker)"
          echo "$GHCR_TOKEN" | "$engine" login ghcr.io -u "$GHCR_USER" --password-stdin
          image="ghcr.io/chobbledotcom/tickets"
          # The immutable per-commit tag first, so every run publishes
          # its own commit regardless of run ordering.
          "$engine" tag "$image:latest" "$image:sha-${GITHUB_SHA}"
          "$engine" push "$image:sha-${GITHUB_SHA}"
          # Move :latest only when this run's commit is still main's tip;
          # an overtaken run leaves :latest to the newer one, and cannot
          # roll consumers back.
          tip="$(curl -fsS \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | jq -r .sha)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::warning::$GITHUB_SHA is no longer main's tip ($tip). Published the commit tag, left :latest to the newer run."
            exit 0
          fi
          "$engine" push "$image:latest"

