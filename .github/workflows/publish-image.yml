name: Publish Docker image

# Create Release calls this workflow after the GitHub release succeeds.
# Only GitHub's latest release can replace the registry's latest image.

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

# Serialise image pushes. The release lookup also excludes superseded retries.
concurrency:
  group: publish-image
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: devenv --profile ci shell bash -- -e {0}

jobs:
  publish:
    # Release dispatches on other refs and forks cannot publish this image.
    if: github.repository == 'chobbledotcom/tickets' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
        with:
          profile: ci

      # Builds the static assets and assembles the OCI image. See devenv.nix
      # (scripts.container-build) for why the Deno step runs in the shell
      # rather than in the sandbox.
      - name: Build the runtime image
        run: container-build

      - name: Load the image into the container engine
        run: container-load

      # `container-check` boots the loaded image and requires /health,
      # home 503, and setup 200 to answer, then checks SIGTERM stops the
      # container cleanly.
      - name: Verify the image boots and serves
        run: container-check

      - name: Copy the image to the registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # GHCR creates the package private on the first push. Make it public
          # once, so platforms and self-hosters can pull without credentials:
          # GitHub → the chobbledotcom org → the tickets package → Package
          # settings → Change visibility.
          engine="$(command -v podman || command -v docker)"
          echo "$GHCR_TOKEN" | "$engine" login ghcr.io -u "$GHCR_USER" --password-stdin
          image="ghcr.io/chobbledotcom/tickets"
          # Keep the commit image even when a newer release supersedes this run.
          "$engine" tag "$image:latest" "$image:sha-${GITHUB_SHA}"
          "$engine" push "$image:sha-${GITHUB_SHA}"
          latest_tag="$(curl -fsS \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | jq -er '.tag_name | select(type == "string" and length > 0)')"
          if [ "$latest_tag" != "$RELEASE_TAG" ]; then
            echo "::warning::Release $RELEASE_TAG is not the latest release ($latest_tag). Published the commit tag. Left :latest unchanged."
            exit 0
          fi
          "$engine" push "$image:latest"
