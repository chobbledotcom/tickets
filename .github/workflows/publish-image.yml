name: Publish Docker image

# Assembles the self-host OCI image with devenv (devenv.nix,
# outputs.tickets-image) and pushes it to the GitHub Container Registry.
# Self-hosters and the alternative-deployment platforms pull this image
# instead of building from source. The image carries the pinned Deno
# runtime, built static assets, and the server's module cache. `latest`
# moves on every merge to main; `sha-<commit>` tags are immutable.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges to main close together must not race the :latest tag.
# Concurrency-group ordering is not guaranteed, so keep only one run at
# a time and make the pushes order-safe below: every run publishes an
# immutable per-commit tag, and moves :latest only after confirming its
# commit is still main's tip.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: devenv --profile ci shell bash -- -e {0}

jobs:
  publish:
    # workflow_dispatch can select any branch, and a fork carries its own
    # main — only this repository's own main may own :latest and the
    # chobbledotcom ghcr.io namespace.
    if: github.repository == 'chobbledotcom/tickets' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
        with:
          profile: ci

      # Builds the static assets and assembles the OCI image. See devenv.nix
      # (scripts.container-build) for why the Deno step runs in the shell
      # rather than in the sandbox.
      - name: Build the runtime image
        run: container-build

      - name: Load the image into the container engine
        run: container-load

      # `container-check` boots the loaded image and requires /health,
      # home 503, and setup 200 to answer, then checks SIGTERM stops the
      # container cleanly.
      - name: Verify the image boots and serves
        run: container-check

      - name: Copy the image to the registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GHCR creates the package private on the first push. Make it public
          # once, so platforms and self-hosters can pull without credentials:
          # GitHub → the chobbledotcom org → the tickets package → Package
          # settings → Change visibility.
          engine="$(command -v podman || command -v docker)"
          echo "$GHCR_TOKEN" | "$engine" login ghcr.io -u "$GHCR_USER" --password-stdin
          image="ghcr.io/chobbledotcom/tickets"
          # The immutable per-commit tag first, so every run publishes
          # its own commit regardless of run ordering.
          "$engine" tag "$image:latest" "$image:sha-${GITHUB_SHA}"
          "$engine" push "$image:sha-${GITHUB_SHA}"
          # Move :latest only when this run's commit is still main's tip;
          # an overtaken run leaves :latest to the newer one, and cannot
          # roll consumers back.
          tip="$(curl -fsS \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | jq -r .sha)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::warning::$GITHUB_SHA is no longer main's tip ($tip). Published the commit tag, left :latest to the newer run."
            exit 0
          fi
          "$engine" push "$image:latest"
