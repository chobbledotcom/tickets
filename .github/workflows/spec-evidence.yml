name: Specification evidence

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

env:
  STRIPE_MOCK_VERSION: "0.188.0"

permissions:
  contents: read

defaults:
  run:
    shell: devenv shell bash -- -e {0}

concurrency:
  group: specification-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv

      - name: Cache stripe-mock
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .bin
          key: stripe-mock-${{ env.STRIPE_MOCK_VERSION }}-linux-amd64

      # The devenv environment provides Chromium on Linux — enterShell
      # exports CHROMIUM_EXECUTABLE, which the harness prefers — so these
      # captures run with the same browser developers use locally. No
      # Playwright browser download is needed.

      - name: Test screenshot browser contracts
        run: deno task test:screenshot-contract

      - name: Capture specification evidence
        run: deno task specs:evidence

      - name: Upload specification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tickets-evidence
          path: reports/evidence
          if-no-files-found: error
          retention-days: 35
