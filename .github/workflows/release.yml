name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name (will be suffixed to date, e.g. '2026-01-30 - your name')"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubicloud-standard-4
    # The secrets this job reads live in this environment, which only main can use.
    environment: production
    outputs:
      tag: ${{ steps.create-release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0

      # A missing secret must stop the run here, not after the build or part
      # of the way through a deploy.
      - name: Check the secrets this run needs
        shell: bash
        env:
          BUNNY_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          CDN_URL: ${{ secrets.CDN_URL }}
          CDN_BUNNY_STORAGE_ZONE_NAME: ${{ secrets.CDN_BUNNY_STORAGE_ZONE_NAME }}
          CDN_BUNNY_STORAGE_ZONE_KEY: ${{ secrets.CDN_BUNNY_STORAGE_ZONE_KEY }}
          CDN_BUNNY_STORAGE_HOST: ${{ secrets.CDN_BUNNY_STORAGE_HOST }}
          CDN_BUNNY_PULL_ZONE_ID: ${{ secrets.CDN_BUNNY_PULL_ZONE_ID }}
        run: |
          scripts/ci/require-env.sh \
            --together CDN_URL,CDN_BUNNY_STORAGE_ZONE_NAME,CDN_BUNNY_STORAGE_ZONE_KEY,CDN_BUNNY_STORAGE_HOST,CDN_BUNNY_PULL_ZONE_ID \
            --if CDN_URL BUNNY_ACCESS_KEY
          scripts/ci/check-credentials.sh bunny cdn-zone

      - name: Build Bunny edge script
        uses: $/.github/actions/build-bunny-script
        with:
          build_commit: ${{ github.sha }}
          cdn_url: ${{ secrets.CDN_URL }}
          cdn_bunny_storage_zone_name: ${{ secrets.CDN_BUNNY_STORAGE_ZONE_NAME }}
          cdn_bunny_storage_zone_key: ${{ secrets.CDN_BUNNY_STORAGE_ZONE_KEY }}
          cdn_bunny_storage_host: ${{ secrets.CDN_BUNNY_STORAGE_HOST }}
          cdn_bunny_pull_zone_id: ${{ secrets.CDN_BUNNY_PULL_ZONE_ID }}
          bunny_access_key: ${{ secrets.BUNNY_ACCESS_KEY }}

      - name: Create release
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          TAG="$(cat .build-tag)"
          TITLE="$(date -u +%Y-%m-%d) - $RELEASE_NAME"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "" \
            bunny-script.ts
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish-image:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/publish-image.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
