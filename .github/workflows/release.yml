name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name (will be suffixed to date, e.g. '2026-01-30 - your name')"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubicloud-standard-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Bunny edge script
        uses: ./.github/actions/build-bunny-script
        with:
          build_commit: ${{ github.sha }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(cat .build-tag)"
          TITLE="$(date -u +%Y-%m-%d) - ${{ inputs.release_name }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "" \
            bunny-script.ts
