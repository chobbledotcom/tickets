# Browser-driven end-to-end payment tests against the REAL provider sandboxes.
#
# Unlike the main suite (which uses stripe-mock and stubs), this boots the real
# app server, exposes it through a cloudflared quick tunnel, and drives a real
# Chromium through a full paid booking — including entering a sandbox test card
# on the provider's hosted checkout page and the webhook/return-URL round-trip.
#
# Each leg runs TWO journeys on the same server: the classic single-listing
# booking, then a COMPLEX order via the /order gallery (a package + one member
# also sold on its own row + a plain listing, one checkout paying every path),
# verified path-by-path on the admin side — the real-sandbox twin of the
# stubbed test/e2e/order-journeys.test.ts suite (src/order-flow.ts).
# The Stripe leg also tests the connection, rotates its webhook endpoint, waits
# for a signed webhook, checks the PaymentIntent, and issues a real test refund.
#
# It is deliberately NOT a PR gate: it needs network to third-party sandboxes
# and is inherently slower/flakier than mocked tests. It runs nightly and on
# demand. Every leg must execute: a missing provider secret fails its leg.
#
# Required repository secrets:
#   STRIPE_SECRET_KEY          — sk_test_… (Stripe test mode)
#   SQUARE_ACCESS_TOKEN        — Square sandbox access token
#   SQUARE_LOCATION_ID         — Square sandbox location id
#   SUMUP_API_KEY              — SumUp sandbox secret API key
#   SUMUP_MERCHANT_CODE        — SumUp sandbox merchant code
# Optional repository secret:
#   NTFY_URL                   — ntfy topic URL pinged if a leg fails
# The "free" leg needs no secrets — it is a harness/app self-test.

name: Payment sandbox e2e

on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC nightly (off-peak, avoids the top-of-hour rush).
    - cron: "17 3 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: devenv shell bash -- -e {0}

concurrency:
  group: payment-sandbox-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The harness bounds every step, scenario, and teardown internally, so a
    # healthy leg finishes well inside this. The limit stops a stalled runner
    # step (for example a hung apt mirror) from holding a leg for hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [free, stripe, square, sumup]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # No later step runs an authenticated git command, and the job
          # runs repository code with provider secrets in its environment.
          persist-credentials: false

      - name: Set up devenv
        uses: ./.github/actions/setup-devenv

      - name: Install cloudflared
        env:
          CLOUDFLARED_VERSION: "2026.8.3"
          # sha256 of cloudflared-linux-amd64 for the version above.
          CLOUDFLARED_SHA256: f29324fe934d1e100617484c78deef803c4dc2cd351d645bbde42e96b4fccc5e
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $RUNNER_TEMP/bin/cloudflared" \
            | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/bin/cloudflared"
          # $GITHUB_PATH only affects later steps, so verify via the full path here.
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cloudflared" --version

      # The devenv environment provides Chromium on Linux — enterShell
      # exports CHROMIUM_EXECUTABLE, which the e2e harness reads — so every
      # leg runs the same browser developers use locally. The ubuntu-latest
      # system Chrome and a Playwright browser download are both unneeded.

      - name: Run ${{ matrix.target }} payment e2e
        id: payment-run
        env:
          # Throwaway key for the ephemeral local DB — not a real secret.
          DB_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SQUARE_SANDBOX: "true"
          SUMUP_API_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT_CODE: ${{ secrets.SUMUP_MERCHANT_CODE }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: deno task e2e ${{ matrix.target }}

      - name: Verify payment leg execution
        env:
          ACTUAL_RESULT: ${{ steps.payment-run.outputs.result }}
        run: |
          if [[ "$ACTUAL_RESULT" != "executed" ]]; then
            echo "The ${{ matrix.target }} payment leg did not report that it executed." >&2
            exit 1
          fi

      - name: Upload run artifacts (screenshots, page HTML, server logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.target }}-artifacts
          path: e2e-payments/artifacts/
          if-no-files-found: ignore
