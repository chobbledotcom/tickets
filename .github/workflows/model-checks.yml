name: Model checks

# A cached model check is a recorded verdict for the same inputs. This suite
# deliberately runs with no pass cache, so it finds a change to the checker,
# the runner environment, or the machine. It does not gate merges. Each model
# runs as its own job on its own runner, and the jobs run in parallel.
on:
  schedule:
    # Nightly at 04:11 UTC. The off-the-hour minute is not a peak for
    # scheduled runs.
    - cron: "11 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The models profile carries Apalache and Java. Every run step uses it, as the
# model step in test.yml does. The plan job only lists names, so it overrides
# the shell with the ci profile.
defaults:
  run:
    shell: devenv --profile models shell bash -- -e {0}

jobs:
  plan:
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    defaults:
      run:
        shell: devenv --profile ci shell bash -- -e {0}
    outputs:
      models: ${{ steps.list.outputs.models }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: $/.github/actions/setup-devenv
        with:
          profile: ci

      # The registry is the one list of models, so a new model gets a job
      # without a workflow edit.
      - name: List the registered models
        id: list
        run: echo "models=$(deno task --quiet verify:models --list)" >> "$GITHUB_OUTPUT"

  model-checks:
    needs: plan
    name: model-checks (${{ matrix.model }})
    runs-on: ubicloud-standard-2
    # A wedged checker must fail loudly, so the job has a hard limit.
    timeout-minutes: 30
    strategy:
      # One failed model must not hide the verdict of the others.
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: $/.github/actions/setup-devenv
        with:
          profile: models

      # The runner reads .verify-models-passes. A restored cache would hide
      # exactly the environment change this job exists to find.
      - name: Assert the pass cache is empty
        run: test ! -e .verify-models-passes

      - name: Run the model checks
        env:
          MODEL: ${{ matrix.model }}
        run: deno task verify:models --model "$MODEL"
